<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gnos - 価格履歴</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0a0a0a; color: #e0e0e0;
    min-height: 100vh; padding: 40px 32px;
    font-size: 16px; line-height: 1.6;
  }
  .container { max-width: 840px; margin: 0 auto; }

  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 28px;
  }
  .back {
    font-size: 13px; color: #4a7a5a; text-decoration: none;
    opacity: 0.8; transition: opacity 0.15s;
  }
  .back:hover { opacity: 1; text-decoration: underline; }
.game-title { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .store-link {
    font-size: 13px; color: #4a7a5a; text-decoration: none;
    opacity: 0.8; transition: opacity 0.15s; display: inline-block; margin-bottom: 32px;
  }
  .store-link:hover { opacity: 1; text-decoration: underline; }

  canvas { width: 100%; max-width: 840px; margin-bottom: 28px; }

  .section-label {
    font-size: 12px; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; color: #444; margin-bottom: 12px;
  }

  .price-table {
    width: 100%; border-collapse: collapse; font-size: 14px;
  }
  .price-table th {
    text-align: left; padding: 8px 12px;
    color: #444; border-bottom: 1px solid #1c1c1c;
    font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .price-table td {
    padding: 11px 12px; border-bottom: 1px solid #131313;
  }
  .price-table tr:last-child td { border-bottom: none; }
  .discount { color: #6fce8a; font-weight: 500; }
  .badge-low {
    display: inline-block; margin-left: 8px;
    font-size: 10px; font-weight: 600; letter-spacing: 0.04em;
    background: #2a4a1e; color: #8ecf5a; border: 1px solid #3a6a28;
    border-radius: 4px; padding: 1px 6px; vertical-align: middle;
  }

  .loading { color: #444; font-size: 14px; }
  .empty { color: #333; font-size: 14px; padding: 32px 0; text-align: center; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"
        integrity="sha512-CQBWl4fJHWbryGE+Pc7UAxWMUMNMWzWxF4SQo9CgkJIN1kx6djDQZjh3Y8SZ1d+6I+1zze6Z7kHXO7q3UyZAWw=="
        crossorigin="anonymous"></script>
</head>
<body>
<div class="container">

<div class="topbar">
  <a class="back" href="index.html">← ウォッチリストに戻る</a>
</div>

<h1 class="game-title" id="title">読み込み中...</h1>
<a class="store-link" id="storeLink" target="_blank"></a>

<canvas id="chart" height="260"></canvas>

<p class="section-label">価格履歴</p>
<table class="price-table">
  <thead><tr><th>日時</th><th>価格</th><th>割引</th></tr></thead>
  <tbody id="tbody"><tr><td colspan="3" class="loading">読み込み中...</td></tr></tbody>
</table>

</div>
<script>
const API_URL = "__API_URL__";
const params = new URLSearchParams(location.search);
const appId = params.get("app_id");

if (!appId) {
  document.getElementById("title").textContent = "app_id が指定されていません";
} else {
  const storeLink = document.getElementById("storeLink");
  storeLink.href = "https://store.steampowered.com/app/" + appId + "/";
  storeLink.textContent = "Steam ストアページ →";
  loadHistory();
}

async function loadHistory() {
  try {
    const [gamesRes, histRes] = await Promise.all([
      fetch(API_URL + "/games"),
      fetch(API_URL + "/history?app_id=" + appId),
    ]);
    const gamesData = await gamesRes.json();
    const data = await histRes.json();

    const game = (gamesData.games || []).find(g => g.app_id === appId);
    document.getElementById("title").textContent = game ? game.name : "App ID: " + appId;

    if (!data.prices || data.prices.length === 0) {
      document.getElementById("tbody").innerHTML =
        '<tr><td colspan="3" class="empty">履歴データがありません</td></tr>';
      return;
    }

    const sorted = [...data.prices].sort((a, b) => a.checked_at.localeCompare(b.checked_at));

    // テーブル（価格が変わったレコードのみ、新しい順）
    const changed = sorted.filter((p, i) =>
      i === 0 || p.price !== sorted[i - 1].price
    );
    const minPrice = Math.min(...sorted.map(p => p.price));
    const tbody = document.getElementById("tbody");
    tbody.innerHTML = [...changed].reverse().map(p => {
      const date = new Date(p.checked_at).toLocaleString("ja-JP");
      const isLow = p.price === minPrice;
      const price = "¥" + (p.price / 100).toLocaleString()
        + (isLow ? '<span class="badge-low">最安値</span>' : "");
      const disc = p.discount > 0
        ? '<span class="discount">' + p.discount + '%OFF</span>'
        : "-";
      return '<tr><td>' + date + '</td><td>' + price + '</td><td>' + disc + '</td></tr>';
    }).join("");

    // グラフ
    // [NOTE] 履歴は価格が変わった時点だけなので、横軸は時刻そのもの（点の数ではなく経過時間に比例）にする
    const points = changed.map(p => ({ x: Date.parse(p.checked_at), y: p.price / 100 }));
    // [NOTE] 最後の変化から今日まで同じ価格が続いているので、今の時刻に同じ値の点を足して線を伸ばす
    points.push({ x: Date.now(), y: points[points.length - 1].y });
    const lastIndex = points.length - 1;
    const md = ms => { const d = new Date(ms); return (d.getMonth() + 1) + "/" + d.getDate(); };

    new Chart(document.getElementById("chart"), {
      type: "line",
      data: {
        datasets: [{
          label: "価格 (円)",
          data: points,
          borderColor: "#4a8a5a",
          backgroundColor: "rgba(74,138,90,0.08)",
          fill: true,
          // [NOTE] 価格は次に変わるまで同じ値が続くので、点から水平に伸ばし、次の点で縦に変える
          stepped: "after",
          // [NOTE] 今日まで伸ばすために足した点は実際の変化ではないので、丸を描かない
          pointRadius: ctx => ctx.dataIndex === lastIndex ? 0 : 3,
          pointBackgroundColor: "#4a8a5a",
        }]
      },
      options: {
        responsive: true,
        scales: {
          y: {
            ticks: { color: "#555", callback: v => "¥" + v.toLocaleString() },
            grid: { color: "#161616" },
            border: { color: "#1c1c1c" },
          },
          x: {
            type: "linear",
            ticks: { color: "#555", maxTicksLimit: 8, callback: md },
            grid: { color: "#161616" },
            border: { color: "#1c1c1c" },
          }
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              title: items => new Date(items[0].parsed.x).toLocaleString("ja-JP"),
              label: ctx => "¥" + ctx.parsed.y.toLocaleString(),
            }
          }
        }
      }
    });

  } catch (e) {
    document.getElementById("tbody").innerHTML =
      '<tr><td colspan="3" class="empty">読み込みに失敗しました: ' + e.message + '</td></tr>';
  }
}

</script>
</body>
</html>
